name: Build Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  electron-entry-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-module/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native-module/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build native module
        run: NATIVELY_BUILD_ALL_MAC_ARCHES=1 npm run build:native

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Verify packaged entrypoint exists
        run: test -f dist-electron/electron/main.js

      - name: Verify native artifacts
        run: |
          echo "Native module artifacts:"
          ls -la native-module/*.node
